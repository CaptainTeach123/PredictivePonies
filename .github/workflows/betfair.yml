# Downloads purchased Betfair historical files into the Actions cache and runs
# the exchange backtests. Nothing is committed (licensed data). Logs show
# counts and summary numbers only.
#
# Setup: Settings -> Secrets and variables -> Actions
#   secrets  BETFAIR_USERNAME, BETFAIR_PASSWORD, BETFAIR_APP_KEY
#   variable BETFAIR_SSO_URL (optional; Australian accounts may need
#            https://identitysso.betfair.com.au/api/login)
# Betfair may refuse logins from GitHub's (US) servers; if so, run
# scripts/betfair_download.py on your own computer instead.
name: Betfair history

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First month (YYYY-MM)"
        default: "2025-10"
      to:
        description: "Last month (YYYY-MM)"
        default: "2026-09"
      countries:
        description: "Comma-separated country codes"
        default: "AU"
      dry_run:
        description: "Only list purchased data and basket size"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  betfair:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
      BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
      BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
      BETFAIR_SSO_URL: ${{ vars.BETFAIR_SSO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore store
        uses: actions/cache/restore@v4
        with:
          path: data/raw/betfair
          key: betfair-store-${{ github.run_id }}
          restore-keys: betfair-store-
      - name: Download
        run: >
          python scripts/betfair_download.py --from ${{ inputs.from }} --to ${{ inputs.to }}
          --countries ${{ inputs.countries }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Backtest (summary numbers only)
        if: ${{ !inputs.dry_run }}
        run: |
          pip install -q -r requirements.txt
          python scripts/betfair_backtest.py
      - name: Save store
        if: always() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: data/raw/betfair
          key: betfair-store-${{ github.run_id }}
